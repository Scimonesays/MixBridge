[package]
name = "mixbridge-desktop"
version = "0.1.0"
description = "MixBridge desktop shell"
authors = ["MixBridge"]
edition = "2021"

[lib]
name = "mixbridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[profile.release]
panic = "abort"
lto = true
