<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MixBridge</title>
    <link rel="icon" type="image/png" href="/src/assets/branding/mixbridge-logo.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <img class="logo" src="/src/assets/branding/mixbridge-logo.png" alt="MixBridge" width="48" height="48" />
        <div class="top-actions">
          <button id="btn-preset" class="icon-btn" type="button" title="Presets" aria-label="Presets">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
          </button>
          <button id="btn-diag" class="icon-btn" type="button" title="Advanced" aria-label="Advanced" aria-haspopup="dialog">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.5 7.5 0 0 0 .06-.94 7.5 7.5 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.3-.06.62-.06.94s.02.64.06.94L2.83 14.16a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96c.23.1.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
          </button>
          <span id="air-badge" class="badge" title="Broadcast state" aria-live="polite">Standby</span>
        </div>
      </header>

      <main class="flow" aria-label="Sources mix outputs">
        <section class="col sources" aria-labelledby="lbl-sources">
          <h2 id="lbl-sources" class="col-title">Sources</h2>
          <div id="source-list" class="stack" role="list"></div>
          <div class="row-actions">
            <button id="btn-add" class="icon-btn" type="button" title="Add source" aria-label="Add source" aria-haspopup="dialog" aria-expanded="false">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
            </button>
          </div>
        </section>

        <section class="mix-core" aria-labelledby="lbl-mix">
          <h2 id="lbl-mix" class="col-title">Mix</h2>
          <div class="master-ring">
            <div class="meter-wrap tall" aria-label="Master meter">
              <div id="meter" class="meter vertical" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
          </div>
          <button id="btn-live" class="live-btn standby" type="button" title="Go Live" aria-label="Go Live" aria-pressed="false">
            <svg class="live-glyph" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" fill="currentColor"/>
              <path fill="none" stroke="currentColor" stroke-width="1.6" d="M7.5 7.5a6.4 6.4 0 0 1 9 0M5 5a10 10 0 0 1 14 0"/>
            </svg>
            <span id="live-label" class="live-label">Go Live</span>
          </button>
        </section>

        <section class="col outputs" aria-labelledby="lbl-outputs">
          <h2 id="lbl-outputs" class="col-title">Outputs</h2>
          <div class="stack">
            <div class="dest-card" data-route="monitor" title="Monitor">
              <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2v-8H5a7 7 0 0 1 14 0h-2v8h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/>
              </svg>
              <span class="route-tag">Monitor</span>
              <div class="meter-wrap thin" aria-hidden="true"><div id="monitor-meter" class="meter"></div></div>
            </div>
            <div id="live-route" class="dest-card dim" data-route="live" title="Live" role="button" tabindex="0" aria-label="Choose live output">
              <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M4 10v4h3l5 4V6L7 10H4zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>
              </svg>
              <span id="live-route-label" class="route-tag">Live</span>
              <div class="meter-wrap thin" aria-hidden="true"><div id="live-meter" class="meter"></div></div>
            </div>
          </div>
        </section>
      </main>

      <dialog id="picker" class="picker" aria-label="Add source">
        <div class="picker-panel">
          <div id="picker-root" class="picker-choices"></div>
        </div>
      </dialog>

      <dialog id="diag" class="picker diag" aria-label="Advanced">
        <div class="picker-panel diag-panel">
          <div class="diag-grid" aria-live="polite">
            <div class="diag-cell"><span class="diag-k">Engine</span><span id="diag-state" class="diag-v">—</span></div>
            <div class="diag-cell"><span class="diag-k">Broadcast</span><span id="diag-bcast" class="diag-v">—</span></div>
            <div class="diag-cell"><span class="diag-k">Live dest</span><span id="diag-live" class="diag-v">—</span></div>
            <div class="diag-cell"><span class="diag-k">Latency</span><span id="diag-lat" class="diag-v">—</span></div>
            <div class="diag-cell"><span class="diag-k">Xruns</span><span id="diag-xruns" class="diag-v">—</span></div>
            <div class="diag-cell"><span class="diag-k">Underruns</span><span id="diag-under" class="diag-v">—</span></div>
            <div class="diag-cell"><span class="diag-k">Overruns</span><span id="diag-over" class="diag-v">—</span></div>
            <div class="diag-cell"><span class="diag-k">Frames</span><span id="diag-frames" class="diag-v">—</span></div>
            <div class="diag-cell wide"><span class="diag-k">Feedback</span><span id="diag-fb" class="diag-v">—</span></div>
          </div>
          <div class="diag-actions">
            <button type="button" id="diag-restart" class="icon-btn" title="Restart engine" aria-label="Restart engine">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 6V3L8 7l4 4V8a4 4 0 1 1-4 4H6a6 6 0 1 0 6-6z"/></svg>
            </button>
            <button type="button" id="diag-close" class="icon-btn ghost" title="Close" aria-label="Close">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6 6.4 5z"/></svg>
            </button>
          </div>
        </div>
      </dialog>

      <p id="status" class="status" role="status" aria-live="assertive"></p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
